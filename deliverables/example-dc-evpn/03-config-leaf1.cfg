! ===========================================================================
! LEAF1 — Acme DC EVPN-VXLAN fabric (NX-OS)  | generated from 02-lld.md
! Skill: config-generator (vendor ref: nxos). Idempotent. Apply order:
!   features -> CoPP -> mgmt/SSH -> underlay (OSPF) -> overlay (BGP EVPN) ->
!   VLAN/VNI -> SVIs (anycast GW) -> NVE. Mgmt + underlay first = lockout-safe.
! Validator-gated (House Rule 2). No plaintext secrets; SSH only.
! ===========================================================================

hostname LEAF1

! --- Features (NX-OS gates each capability behind 'feature') ---
feature bgp
feature ospf
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
nv overlay evpn
feature lacp

! --- Control-plane protection: keep the shipped strict CoPP profile ---
copp profile strict

! --- Management plane: dedicated VRF, SSH only (no telnet, no plaintext) ---
vrf context management
ssh key rsa 2048
no feature telnet

! --- Underlay: OSPF area 0, point-to-point to the spines (jumbo) ---
interface loopback0
  description router-id / BGP source
  ip address 10.255.1.1/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP NVE source
  ip address 10.255.2.1/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description to:SPINE1.Eth1/1 [underlay]
  mtu 9216
  no switchport
  ip address 10.1.0.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/2
  description to:SPINE2.Eth1/1 [underlay]
  mtu 9216
  no switchport
  ip address 10.1.0.3/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

router ospf UNDERLAY
  router-id 10.255.1.1

! --- Tenant: VLAN 10 -> L2VNI 10010; VRF TENANT-A -> L3VNI 50001 ---
vlan 10
  vn-segment 10010
vlan 901
  vn-segment 50001

vrf context TENANT-A
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn

! Distributed anycast default gateway — identical MAC fabric-wide
fabric forwarding anycast-gateway-mac 0000.2222.3333

interface Vlan10
  description TENANT-A web subnet (anycast gateway)
  no shutdown
  vrf member TENANT-A
  ip address 10.20.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan901
  description TENANT-A L3VNI core SVI (50001)
  no shutdown
  vrf member TENANT-A
  ip forward

! --- Host-facing access port (dual-homed upstream via vPC/ESI) ---
interface Ethernet1/10
  description to:HostA [TENANT-A vlan10]
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

! --- NVE: VXLAN VTEP, BGP-EVPN host reachability, ingress replication ---
interface nve1
  description VXLAN VTEP
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 50001 associate-vrf

! --- Overlay: iBGP L2VPN EVPN to the spine route-reflectors (source lo0) ---
router bgp 65001
  router-id 10.255.1.1
  address-family l2vpn evpn
  neighbor 10.255.0.11
    remote-as 65001
    description SPINE1-RR
    update-source loopback0
    address-family l2vpn evpn
      send-community extended
  neighbor 10.255.0.12
    remote-as 65001
    description SPINE2-RR
    update-source loopback0
    address-family l2vpn evpn
      send-community extended
  vrf TENANT-A
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map ALL-DIRECT

route-map ALL-DIRECT permit 10

end
