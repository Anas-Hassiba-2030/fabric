/* =========================================================================
 * PE3 - Acme SP core (DC3, Junos)  |  generated from 02-lld.md
 * Skill: config-generator (vendor ref: junos) + multivendor-translator (parity with PE1).
 * Candidate config: commit confirmed 5, then commit. Lockout-safe. Validator-gated (House Rule 2).
 * Same intent as PE1 (IOS-XR), expressed in Junos: SR-MPLS + IS-IS + VPNv4 + eBGP/GTSM.
 * ========================================================================= */

set system host-name PE3
set system services ssh
delete system services telnet

/* --- management plane: dedicated instance, SSH only, TACACS+ (no plaintext) --- */
set system tacplus-server 10.30.0.10
set system authentication-order tacplus

/* --- Loopback0: router-id + SR node-SID source (per LLD: 10.255.0.3, SID 16003) --- */
set interfaces lo0 unit 0 family inet address 10.255.0.3/32
set interfaces lo0 unit 0 family iso
set interfaces lo0 unit 0 family inet filter input RE-PROTECT

/* --- core links to P1 (10.0.0.7/31) and P2 (10.0.0.9/31), jumbo, ISO+MPLS families --- */
set interfaces ge-0/0/0 description "to:P1.Gi0/0/0/2 [core]"
set interfaces ge-0/0/0 mtu 9216
set interfaces ge-0/0/0 unit 0 family inet address 10.0.0.7/31
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 description "to:P2.Gi0/0/0/2 [core]"
set interfaces ge-0/0/1 mtu 9216
set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.9/31
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family mpls

/* --- customer-facing (CustB CE) in the VRF, eBGP --- */
set interfaces ge-0/0/2 description "to:CustB-CE [L3VPN-CustB eBGP]"
set interfaces ge-0/0/2 unit 0 family inet address 198.51.100.1/30

/* --- IS-IS L2 + Segment Routing (SPRING) + TI-LFA (HW/BFD dependency: confirm Q3) --- */
set protocols isis level 1 disable
set protocols isis interface lo0.0 passive
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis backup-spf-options use-post-convergence-lsp
set protocols isis source-packet-routing srgb start-label 16000 index-range 8000
set protocols isis interface lo0.0 level 2 node-segment ipv4-index 3
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

/* --- BGP: iBGP VPNv4 to RR1 (parity with PE1 anycast/RR design) --- */
set routing-options autonomous-system 65000
set routing-options router-id 10.255.0.3
set protocols bgp group RR type internal
set protocols bgp group RR local-address 10.255.0.3
set protocols bgp group RR family inet-vpn unicast
set protocols bgp group RR neighbor 10.255.0.254 description RR1
set protocols bgp group RR neighbor 10.255.0.250 description RR-anycast

/* --- CustB L3VPN: RD/RT per LLD scheme, eBGP to CE with GTSM (RFC 5082) --- */
set routing-instances CustB instance-type vrf
set routing-instances CustB interface ge-0/0/2.0
set routing-instances CustB route-distinguisher 10.255.0.3:101
set routing-instances CustB vrf-target target:65000:101
set routing-instances CustB protocols bgp group CE type external
set routing-instances CustB protocols bgp group CE peer-as 65011
set routing-instances CustB protocols bgp group CE ttl 1
set routing-instances CustB protocols bgp group CE neighbor 198.51.100.2 description CustB-CE

/* --- QoS (CoS): 5-class parity with PE1 markings --- */
set class-of-service forwarding-classes class REALTIME queue-num 5
set class-of-service forwarding-classes class BUSINESS queue-num 3

/* --- control-plane protection: lo0 RE-PROTECT filter applied above (permit IS-IS/BGP/BFD/SSH, police rest) --- */
