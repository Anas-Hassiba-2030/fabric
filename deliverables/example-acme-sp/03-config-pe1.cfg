! ===========================================================================
! PE1 — Acme SP core (DC1, IOS-XR)  |  generated from 02-lld.md
! Skill: config-generator (vendor ref: ios-xr). Idempotent two-stage commit.
! Apply order: mgmt/AAA staged -> interfaces+IS-IS -> SR -> BGP -> VRF/eBGP -> QoS.
! Lockout-safe: commit confirmed 5, then commit. (House Rule 2 — Validator-gated.)
! ===========================================================================

hostname PE1

! --- AAA / management plane (isolated VRF, SSH only, no plaintext) ---
vrf MGMT
 address-family ipv4 unicast
!
tacacs-server host 10.30.0.10 port 49
 key class7-encrypted-not-plaintext
!
ssh server v2
ssh server vrf MGMT
!
! --- SR global block (identical fabric-wide) ---
segment-routing
 global-block 16000 23999

! --- Loopback0: router-id + SR prefix-SID source ---
interface Loopback0
 description router-id / SR prefix-SID 16001
 ipv4 address 10.255.0.1 255.255.255.255

! --- Core link to P1 (per LLD: 10.0.0.0/31, jumbo) ---
interface GigabitEthernet0/0/0/0
 description to:P1.Gi0/0/0/0 [core]
 ipv4 address 10.0.0.0 255.255.255.254
 mtu 9216
 no shutdown

! --- Customer-facing (CustA CE, eBGP) ---
interface GigabitEthernet0/0/0/1
 description to:CustA-CE [L3VPN-CustA eBGP]
 vrf CustA
 ipv4 address 192.0.2.1 255.255.255.252
 mtu 1500
 no shutdown

! --- IS-IS L2 core with SR + TI-LFA (TI-LFA HW/BFD dependency: confirm Q3) ---
router isis CORE
 is-type level-2-only
 net 49.0001.0100.0000.0001.00
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
  fast-reroute per-prefix ti-lfa
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 1
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast

! --- BGP: iBGP VPNv4 to redundant RRs (anycast + explicit) ---
router bgp 65000
 bgp router-id 10.255.0.1
 address-family vpnv4 unicast
 neighbor 10.255.0.250
  remote-as 65000
  description RR-anycast
  update-source Loopback0
  address-family vpnv4 unicast
 neighbor 10.255.0.254
  remote-as 65000
  description RR1
  update-source Loopback0
  address-family vpnv4 unicast
 !
 ! --- CustA L3VPN: RD/RT per LLD, eBGP to CE with GTSM (RFC 5082) ---
 vrf CustA
  rd 10.255.0.1:100
  address-family ipv4 unicast
   redistribute connected
  neighbor 192.0.2.2
   remote-as 65010
   description CustA-CE
   ttl-security
   address-family ipv4 unicast
    maximum-prefix 1000 80
    route-policy CUSTA-IN in

vrf CustA
 address-family ipv4 unicast
  import route-target 65000:100
  export route-target 65000:100

! --- QoS: 5-class, trust in core / classify at edge ---
class-map match-any REALTIME
 match dscp ef
class-map match-any BUSINESS
 match dscp af31
policy-map CORE-OUT
 class REALTIME
  priority level 1
 class BUSINESS
  bandwidth percent 30
 class class-default

! --- Control-plane protection (LPTS native + explicit policy intent) ---
! LPTS polices control-plane on IOS-XR by default; baseline-specific tuning added per CIS.

end
